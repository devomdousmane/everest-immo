[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/everst-immo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirection vytimo.com → everest-immo.com
[[redirects]]
  from    = "https://vytimo.com/*"
  to      = "https://everest-immo.com/:splat"
  status  = 301
  force   = true

[[redirects]]
  from    = "https://www.vytimo.com/*"
  to      = "https://everest-immo.com/:splat"
  status  = 301
  force   = true
