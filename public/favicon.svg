<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fond sombre -->
  <rect width="64" height="64" fill="#1C1917"/>

  <!-- Petit toit gauche (arrière-plan) -->
  <polyline
    points="8,42 20,24 32,42"
    fill="none"
    stroke="#CA8A04"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.65"
  />

  <!-- Grand toit droit (premier plan) -->
  <polyline
    points="18,42 33,20 48,42"
    fill="none"
    stroke="#CA8A04"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Petite cheminée -->
  <rect x="19" y="28" width="4" height="6" fill="#CA8A04" rx="0.5"/>
</svg>
